<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form CSS Specificity</title>
    <link rel="stylesheet" href="11.css">
    <style>
        .contact-form input { border-color: #60a5fa; }
        .contact-form button { background-color: #0f766e; }
    </style>
</head>
<body>
    <main class="panel">
        <h1>Contact us</h1>
        <p>Compare the external, internal, and inline style rules applied to this form.</p>
        <form class="contact-form" action="#" method="post">
            <label for="specificity-name">Name</label>
            <input id="specificity-name" name="name" type="text" style="border-color: #7c3aed;" required>
            <label for="specificity-email">Email</label>
            <input id="specificity-email" name="email" type="email" required>
            <label for="specificity-message">Message</label>
            <textarea id="specificity-message" name="message" rows="4"></textarea>
            <button type="submit">Send</button>
        </form>
        <p class="note">The name field’s inline border color wins over the internal and external rules. The internal button color wins over the external rule.</p>
    </main>
</body>
</html>
