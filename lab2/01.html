<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Controls</title>
    <link rel="stylesheet" href="01.css">
</head>
<body>
    <main class="form-card">
        <h1>Get in touch</h1>
        <p class="intro">Fill out the form below and we’ll get back to you.</p>

        <form action="#" method="post">
            <div class="field">
                <label for="full-name">Full name</label>
                <input type="text" id="full-name" name="full-name" placeholder="Your name">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter a password">
            </div>

            <fieldset class="field choice-group">
                <legend>Preferred contact method</legend>
                <label class="choice" for="contact-email">
                    <input type="radio" id="contact-email" name="contact-method" value="email">
                    <span>Email</span>
                </label>
                <label class="choice" for="contact-phone">
                    <input type="radio" id="contact-phone" name="contact-method" value="phone">
                    <span>Phone</span>
                </label>
            </fieldset>

            <fieldset class="field choice-group">
                <legend>What can we help with?</legend>
                <label class="choice" for="help-question">
                    <input type="checkbox" id="help-question" name="help-topic" value="question">
                    <span>A question</span>
                </label>
                <label class="choice" for="help-feedback">
                    <input type="checkbox" id="help-feedback" name="help-topic" value="feedback">
                    <span>Feedback</span>
                </label>
            </fieldset>

            <div class="field">
                <label for="topic">Topic</label>
                <select id="topic" name="topic">
                    <option value="" selected disabled>Select a topic</option>
                    <option value="general">General enquiry</option>
                    <option value="support">Technical support</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here"></textarea>
            </div>

            <button type="submit">Send message</button>
        </form>
    </main>
</body>
</html>
