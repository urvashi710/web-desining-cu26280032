<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Typography</title>
    <link rel="stylesheet" href="19.css">
</head>
<body>
    <main class="panel">
        <h1>Create an account</h1>
        <form action="#" method="post">
            <label for="type-name">Full name</label>
            <input id="type-name" name="name" type="text" placeholder="Enter your full name" required>
            <label for="type-email">Email address</label>
            <input id="type-email" name="email" type="email" placeholder="name@example.com" required>
            <label for="type-password">Password</label>
            <input id="type-password" name="password" type="password" placeholder="At least 8 characters" minlength="8" required>
            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
