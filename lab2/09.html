<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Survey</title>
    <link rel="stylesheet" href="09.css">
</head>
<body>
    <main class="panel">
        <h1>Quick customer survey</h1>
        <form action="#" method="post">
            <fieldset>
                <legend>How was your experience?</legend>
                <label><input type="radio" name="experience" value="excellent" required> Excellent</label>
                <label><input type="radio" name="experience" value="good"> Good</label>
                <label><input type="radio" name="experience" value="fair"> Fair</label>
            </fieldset>
            <fieldset>
                <legend>Which areas did you use?</legend>
                <label><input type="checkbox" name="areas" value="website"> Website</label>
                <label><input type="checkbox" name="areas" value="support"> Customer support</label>
                <label><input type="checkbox" name="areas" value="delivery"> Delivery</label>
            </fieldset>
            <label for="survey-comment">Additional comments</label>
            <textarea id="survey-comment" name="comment" rows="4"></textarea>
            <button type="submit">Submit survey</button>
        </form>
    </main>
</body>
</html>
