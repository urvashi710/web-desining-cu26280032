<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Column CSS Grid Form</title>
    <link rel="stylesheet" href="06.css">
</head>
<body>
    <main class="panel">
        <h1>Contact details</h1>
        <form action="#" method="post" class="grid-form">
            <div class="field"><label for="first-name">First name</label><input id="first-name" name="first-name" type="text"></div>
            <div class="field"><label for="last-name">Last name</label><input id="last-name" name="last-name" type="text"></div>
            <div class="field"><label for="grid-email">Email</label><input id="grid-email" name="email" type="email"></div>
            <div class="field"><label for="grid-phone">Phone</label><input id="grid-phone" name="phone" type="tel"></div>
            <div class="field full"><label for="grid-subject">Subject</label><input id="grid-subject" name="subject" type="text"></div>
            <div class="field full"><label for="grid-message">Message</label><textarea id="grid-message" name="message" rows="4"></textarea></div>
            <button class="full" type="submit">Submit</button>
        </form>
    </main>
</body>
</html>
