<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="07.css">
</head>
<body>
    <main class="panel">
        <h1>Share your feedback</h1>
        <form action="#" method="post">
            <label for="feedback-name">Name</label>
            <input id="feedback-name" name="name" type="text" placeholder="Your name">
            <label for="feedback-email">Email</label>
            <input id="feedback-email" name="email" type="email" placeholder="you@example.com">
            <label for="feedback-message">Your feedback</label>
            <textarea id="feedback-message" name="message" rows="5" placeholder="Tell us what you think"></textarea>
            <button type="submit">Send feedback</button>
        </form>
    </main>
</body>
</html>
