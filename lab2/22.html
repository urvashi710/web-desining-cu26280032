<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Subscription</title>
    <link rel="stylesheet" href="22.css">
</head>
<body>
    <main class="newsletter-card">
        <h1>Ideas in your inbox</h1>
        <p>Get our monthly newsletter with practical tips and updates.</p>
        <form action="#" method="post">
            <div class="floating-field">
                <input id="newsletter-email" name="email" type="email" placeholder=" " autocomplete="email" required>
                <label for="newsletter-email">Email address</label>
            </div>
            <button type="submit">Subscribe</button>
        </form>
    </main>
</body>
</html>
