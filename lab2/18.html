<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="18.css">
</head>
<body>
    <main class="contact-layout">
        <section class="contact-form">
            <h1>Contact us</h1>
            <p>Send a message and our team will be in touch.</p>
            <form action="#" method="post">
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name" type="text" required>
                <label for="contact-email">Email</label>
                <input id="contact-email" name="email" type="email" required>
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="4" required></textarea>
                <button type="submit">Send message</button>
            </form>
        </section>
        <aside class="location">
            <h2>Visit our office</h2>
            <address>
                123 Market Street<br>
                San Francisco, CA 94105<br>
                United States
            </address>
            <p><a href="https://maps.google.com/?q=123+Market+Street+San+Francisco+CA+94105">View location map</a></p>
            <p>Monday–Friday<br>9:00 AM–5:00 PM</p>
        </aside>
    </main>
</body>
</html>
