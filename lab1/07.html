<!DOCTYPE html>

<head>
    <title>How to Make a Cup of Tea</title>
</head>
<body>
    <h1>How to Make a Cup of Tea</h1>
    <ol>
        <li>Boil one cup of water.</li>
        <li>Place a tea bag in a mug.</li>
        <li>Pour the hot water into the mug.</li>
        <li>Let the tea steep for three to five minutes.</li>
        <li>Remove the tea bag and add milk or sugar if desired.</li>
    </ol>
</body>
</html>
