<body>
    <h1>Computer Science Glossary</h1>
    <dl>
        <dt>Algorithm</dt>
        <dd>A sequence of steps used to solve a problem.</dd>

        <dt>Variable</dt>
        <dd>A named place to store a value in a program.</dd>

        <dt>Database</dt>
        <dd>An organized collection of information stored electronically.</dd>

        <dt>HTML</dt>
        <dd>A markup language used to structure content on webpages.</dd>
    </dl>
