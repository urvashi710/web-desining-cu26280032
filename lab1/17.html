<!DOCTYPE html>
<html>
<head>
    <title>Product Price List</title>
</head>
<body>
    <h1>Product Price List</h1>
    <table border="1">
        <caption>Available Products and Prices</caption>
        <thead>
            <tr>
                <th scope="col">Product</th>
                <th scope="col">Description</th>
                <th scope="col">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>Hardcover, 120 pages</td>
                <td>$4.50</td>
            </tr>
            <tr>
                <td>Pen Set</td>
                <td>Pack of three blue pens</td>
                <td>$3.25</td>
            </tr>
            <tr>
                <td>Backpack</td>
                <td>Water-resistant school backpack</td>
                <td>$29.99</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
