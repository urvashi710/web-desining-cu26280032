<!DOCTYPE html>
<html>
<head>
    <title>Financial Report</title>
</head>
<body>
    <h1>Financial Report</h1>
    <table border="1">
        <caption>Quarterly Income and Expenses</caption>
        <thead>
            <tr>
                <th scope="col">Category</th>
                <th scope="col">Income</th>
                <th scope="col">Expenses</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">January</th>
                <td>$5,000</td>
                <td>$3,200</td>
            </tr>
            <tr>
                <th scope="row">February</th>
                <td>$5,500</td>
                <td>$3,400</td>
            </tr>
            <tr>
                <th scope="row">March</th>
                <td>$6,000</td>
                <td>$3,600</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total</th>
                <td>$16,500</td>
                <td>$10,200</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
