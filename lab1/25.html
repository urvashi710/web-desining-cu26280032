<!DOCTYPE html>
<html>
<head>
    <title>Customer Survey</title>
</head>
<body>
    <h1>Customer Survey</h1>
    <form>
        <fieldset>
            <legend>About You</legend>
            <p>
                <label for="survey-name">Name:</label>
                <input type="text" id="survey-name" name="name">
            </p>
            <p>
                <label for="survey-email">Email:</label>
                <input type="email" id="survey-email" name="email">
            </p>
        </fieldset>

        <fieldset>
            <legend>Your Experience</legend>
            <p>How satisfied are you with our service?</p>
            <label><input type="radio" name="satisfaction" value="satisfied"> Satisfied</label>
            <label><input type="radio" name="satisfaction" value="neutral"> Neutral</label>
            <label><input type="radio" name="satisfaction" value="unsatisfied"> Unsatisfied</label>
            <p>
                <label for="suggestions">Suggestions:</label><br>
                <textarea id="suggestions" name="suggestions" rows="4" cols="40"></textarea>
            </p>
        </fieldset>

        <button type="submit">Submit Survey</button>
    </form>
</body>
</html>
